<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ماشین حساب ریاضی | بازی ضرب و تقسیم</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', 'Poppins', 'Vazir', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .game-container {
            max-width: 580px;
            width: 100%;
            background: rgba(255,255,240,0.1);
            backdrop-filter: blur(4px);
            border-radius: 70px;
            padding: 20px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,215,0,0.3);
        }

        .game-panel {
            background: #2c3e33;
            background-image: radial-gradient(circle at 20% 30%, #3e5a47, #1f2e26);
            border-radius: 55px;
            padding: 20px;
            box-shadow: inset 0 0 8px #00000033, 0 10px 20px rgba(0,0,0,0.3);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #00000066;
            border-radius: 100px;
            padding: 8px 20px;
            margin-bottom: 20px;
            color: #FFE6A7;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }
        .hearts {
            display: flex;
            gap: 8px;
            font-size: 28px;
            letter-spacing: 4px;
        }
        .timer-box {
            background: #0f212e;
            padding: 5px 15px;
            border-radius: 50px;
            font-family: monospace;
            font-size: 26px;
            font-weight: bold;
            box-shadow: inset 0 0 5px #00bcd4, 0 2px 5px black;
            color: #0ff;
        }
        .score-board {
            background: gold;
            color: #1f3a2b;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 24px;
            font-weight: bold;
        }

        .question-area {
            background: #ede7d9;
            border-radius: 60px;
            padding: 25px 10px;
            margin: 15px 0;
            text-align: center;
            box-shadow: inset 0 2px 5px #b3a582, 0 8px 12px rgba(0,0,0,0.2);
        }
        .question-text {
            font-size: 48px;
            font-weight: 800;
            background: #fff2df;
            display: inline-block;
            padding: 10px 35px;
            border-radius: 70px;
            font-family: monospace;
            letter-spacing: 6px;
            color: #2c4b32;
            box-shadow: 0 4px 0 #bfa27b;
            direction: ltr;
        }

        .answer-display {
            background: #1b2b22;
            margin: 15px 10px;
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #c6ffb7;
            font-size: 32px;
            font-weight: bold;
            direction: ltr;
            text-align: right;
            box-shadow: inset 0 0 0 2px #79c28b, 0 5px 10px black;
        }
        .answer-value {
            background: #00000099;
            padding: 5px 20px;
            border-radius: 40px;
            min-width: 120px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 34px;
            letter-spacing: 4px;
            color: #f5ffb2;
        }
        .answer-label {
            font-size: 24px;
        }

        /* چیدمان جدید ماشین حساب - 3 ستونی */
        .calc-buttons {
            background: #3a2c21;
            border-radius: 45px;
            padding: 15px;
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .calc-btn {
            background: #f5e7d3;
            border: none;
            font-size: 28px;
            font-weight: bold;
            padding: 12px 0;
            border-radius: 60px;
            box-shadow: 0 5px 0 #aa8e64;
            transition: 0.07s linear;
            cursor: pointer;
            color: #2c2b26;
            font-family: monospace;
        }
        .calc-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #aa8e64;
        }
        .equal-btn {
            background: #ffb347;
            color: white;
            box-shadow: 0 5px 0 #c16f1a;
        }
        .clear-btn {
            background: #d95550;
            color: white;
            box-shadow: 0 5px 0 #962d28;
        }
        .zero-btn {
            background: #f5e7d3;
        }
        .status-msg {
            background: #161f1a;
            border-radius: 50px;
            padding: 12px;
            margin-top: 15px;
            text-align: center;
            color: #ffde9c;
            font-weight: bold;
            font-size: 18px;
        }

        /* باکس پیام انگیزشی */
        .motivation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
        }
        .motivation-card {
            background: #fef2dd;
            border-radius: 65px;
            padding: 40px;
            text-align: center;
            min-width: 300px;
            animation: bounce 0.3s ease;
        }
        .motivation-correct {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
        }
        .motivation-wrong {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
        }
        .motivation-text {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .motivation-sub {
            font-size: 20px;
            margin-top: 10px;
        }
        @keyframes bounce {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #fef2dd;
            border-radius: 65px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 40px black;
        }
        input {
            width: 90%;
            padding: 15px;
            margin: 15px 0;
            font-size: 20px;
            border-radius: 60px;
            border: 2px solid #ccb37f;
            text-align: center;
            font-family: inherit;
        }
        button {
            cursor: pointer;
            background: #2e6b47;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 20px;
            border-radius: 50px;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #cbbf91;
            font-size: 14px;
        }
        .anime-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div id="mainGameRoot"></div>

<script>
    let bgAudio = null;
    let correctAudio = null;
    let wrongAudio = null;

    function initAudio() {
        try {
            bgAudio = new Audio("https://uploadkon.ir/uploads/8a9b31_26UBS-1-.mp3");
            bgAudio.loop = true;
            bgAudio.volume = 0.3;
            correctAudio = new Audio("https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3");
            wrongAudio = new Audio("https://www.soundjay.com/misc/sounds/failure-drum-01.mp3");
        } catch(e) { console.warn(e); }
    }

    function playCorrect() { if(correctAudio) { correctAudio.currentTime=0; correctAudio.play().catch(e=>{}); } }
    function playWrong() { if(wrongAudio) { wrongAudio.currentTime=0; wrongAudio.play().catch(e=>{}); } }
    function toggleBgMusic() { 
        if(bgAudio) {
            if(bgAudio.paused) bgAudio.play().catch(e=>console.log);
            else bgAudio.pause();
        }
    }

    // تولید سوالات ضرب
    function generateMultiplicationQuestions() {
        let questions = [];
        let used = new Set();
        while(questions.length < 5) {
            let a = Math.floor(Math.random() * 9) + 1;
            let b = Math.floor(Math.random() * 9) + 1;
            let key = `${a}*${b}`;
            if(!used.has(key)) {
                used.add(key);
                questions.push({ text: `${a} × ${b}`, answer: a*b, type: 'mul' });
            }
        }
        let used2 = new Set();
        while(questions.length < 10) {
            let tens1 = (Math.floor(Math.random() * 9) + 1) * 10;
            let tens2 = (Math.floor(Math.random() * 9) + 1) * 10;
            let key2 = `${tens1}*${tens2}`;
            if(!used2.has(key2) && tens1>=10 && tens2>=10) {
                used2.add(key2);
                questions.push({ text: `${tens1} × ${tens2}`, answer: tens1*tens2, type: 'mul' });
            }
        }
        for(let i=questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        return questions;
    }

    // تولید سوالات تقسیم (عدد بزرگتر سمت چپ)
    function generateDivisionQuestions() {
        let questions = [];
        let usedDiv = new Set();
        while(questions.length < 10) {
            let divisor = Math.floor(Math.random() * 12) + 2;
            let quotient = Math.floor(Math.random() * 12) + 2;
            let dividend = divisor * quotient;
            if(dividend <= 144 && divisor <= 12 && dividend > divisor) {
                let key = `${dividend}/${divisor}`;
                if(!usedDiv.has(key)) {
                    usedDiv.add(key);
                    // نمایش به صورت "عدد بزرگتر ÷ عدد کوچکتر"
                    questions.push({ text: `${dividend} ÷ ${divisor}`, answer: quotient, type: 'div' });
                }
            }
        }
        return questions;
    }

    // کلمات انگیزشی
    const motivationPhrases = {
        correct: [
            "🎉 عالی بود! 🎉", "🔥 فوق‌العاده! 🔥", "💪 به به! 💪", "🌟 نابغه! 🌟", 
            "✨ شگفت‌انگیز! ✨", "🏆 قهرمان! 🏆", "⭐ عالی ادامه بده! ⭐", 
            "🎯 دقیقاً درست! 🎯", "🧠 مغز حسابی!", "📚 ریاضیدان بزرگی!"
        ],
        wrong: [
            "😊 اشکال نداره! دوباره تلاش کن", "💪 هیچ اشکالی نداره! ادامه بده", 
            "🌟 تقریباً درست! یک بار دیگر", "📚 تمرین کن بهتر میشی!", 
            "🎯 نزدیک بود! دوباره امتحان کن", "✨ نگران نباش! تلاش مجدد"
        ]
    };

    function getRandomMotivation(isCorrect) {
        const list = isCorrect ? motivationPhrases.correct : motivationPhrases.wrong;
        return list[Math.floor(Math.random() * list.length)];
    }

    class MathGame {
        constructor(playerName) {
            this.playerName = playerName;
            this.mulQuestions = generateMultiplicationQuestions();
            this.divQuestions = generateDivisionQuestions();
            this.allQuestions = [...this.mulQuestions, ...this.divQuestions];
            this.currentIndex = 0;
            this.score = 0;
            this.lives = 5;
            this.timeLeft = 300;
            this.currentInput = "";
            this.timerInterval = null;
            this.waitingForFeedback = false;
            this.initUI();
            this.startTimer();
            this.renderQuestion();
            this.updateStats();
        }

        initUI() {
            const container = document.getElementById("mainGameRoot");
            container.innerHTML = `
                <div class="game-container">
                    <div class="game-panel">
                        <div class="stats-bar">
                            <div class="hearts" id="heartsDisplay">⭐⭐⭐⭐⭐</div>
                            <div class="timer-box" id="timerDisplay">05:00</div>
                            <div class="score-board" id="scoreDisplay">0</div>
                        </div>
                        <div class="question-area">
                            <div class="question-text" id="questionTxt">...</div>
                        </div>
                        <div class="answer-display">
                            <span class="answer-label">جواب:</span>
                            <div class="answer-value" id="answerValue">0</div>
                        </div>
                        <div class="calc-buttons" id="calcGrid"></div>
                        <div class="status-msg" id="statusMsg">✅ پاسخ را وارد کن!</div>
                        <div style="display:flex; justify-content:center; margin-top:10px; gap:15px;">
                            <button id="bgMusicBtn" style="background:#191919;">🎵 موسیقی</button>
                        </div>
                    </div>
                    <div class="footer">طراح: الهام باقری</div>
                </div>
            `;
            
            // چیدمان جدید دکمه‌ها: 1 2 3 / 4 5 6 / 7 8 9 / 0 = C
            const calcGrid = document.getElementById("calcGrid");
            // ردیف اول: 1,2,3
            // ردیف دوم: 4,5,6
            // ردیف سوم: 7,8,9
            // ردیف چهارم: 0, =, C
            const buttonsRow1 = ['1','2','3'];
            const buttonsRow2 = ['4','5','6'];
            const buttonsRow3 = ['7','8','9'];
            const buttonsRow4 = ['0','=' ,'C'];
            
            let allButtonsHtml = '';
            
            buttonsRow1.forEach(btn => {
                allButtonsHtml += `<button class="calc-btn" data-val="${btn}">${btn}</button>`;
            });
            buttonsRow2.forEach(btn => {
                allButtonsHtml += `<button class="calc-btn" data-val="${btn}">${btn}</button>`;
            });
            buttonsRow3.forEach(btn => {
                allButtonsHtml += `<button class="calc-btn" data-val="${btn}">${btn}</button>`;
            });
            // ردیف چهارم با کلاس‌های خاص
            allButtonsHtml += `<button class="calc-btn zero-btn" data-val="0">0</button>`;
            allButtonsHtml += `<button class="calc-btn equal-btn" data-val="=">=</button>`;
            allButtonsHtml += `<button class="calc-btn clear-btn" data-val="C">C</button>`;
            
            calcGrid.innerHTML = allButtonsHtml;
            
            document.querySelectorAll('.calc-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if(this.waitingForFeedback || this.currentIndex >= this.allQuestions.length) return;
                    const val = btn.dataset.val;
                    if(val === 'C') { this.currentInput = ""; this.updateAnswerDisplay(); }
                    else if(val === '=') { this.checkAnswer(); }
                    else { this.currentInput += val; this.updateAnswerDisplay(); }
                });
            });
            
            document.getElementById("bgMusicBtn").addEventListener("click", () => { toggleBgMusic(); });
            this.updateAnswerDisplay();
        }

        updateAnswerDisplay() {
            const disp = document.getElementById("answerValue");
            if(disp) disp.innerText = this.currentInput === "" ? "?" : this.currentInput;
        }

        updateStats() {
            const heartsDiv = document.getElementById("heartsDisplay");
            if(heartsDiv) {
                let starCount = this.lives;
                let stars = "⭐".repeat(starCount) + "☆".repeat(5-starCount);
                heartsDiv.innerText = stars;
            }
            const scoreSpan = document.getElementById("scoreDisplay");
            if(scoreSpan) scoreSpan.innerText = this.score;
        }

        renderQuestion() {
            if(this.currentIndex >= this.allQuestions.length) {
                this.endGame();
                return;
            }
            const q = this.allQuestions[this.currentIndex];
            document.getElementById("questionTxt").innerText = q.text;
            this.currentInput = "";
            this.updateAnswerDisplay();
            document.getElementById("statusMsg").innerHTML = "✨ پاسخ را با ماشین حساب وارد کن ✨";
        }

        showMotivationMessage(isCorrect, correctAnswer = null) {
            return new Promise((resolve) => {
                const overlay = document.createElement("div");
                overlay.className = "motivation-overlay";
                const card = document.createElement("div");
                card.className = `motivation-card ${isCorrect ? 'motivation-correct' : 'motivation-wrong'}`;
                
                const motivationText = getRandomMotivation(isCorrect);
                
                if(isCorrect) {
                    card.innerHTML = `
                        <div class="motivation-text">✅ درست!</div>
                        <div class="motivation-sub">${motivationText}</div>
                        <div class="motivation-sub" style="font-size: 18px; margin-top: 15px;">+10 امتیاز</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="motivation-text">❌ نادرست</div>
                        <div class="motivation-sub">${motivationText}</div>
                        <div class="motivation-sub" style="font-size: 18px; margin-top: 10px;">جواب صحیح: ${correctAnswer}</div>
                        <div class="motivation-sub" style="font-size: 16px; margin-top: 10px;">-5 امتیاز و کاهش یک جان</div>
                    `;
                }
                overlay.appendChild(card);
                document.body.appendChild(overlay);
                
                setTimeout(() => {
                    overlay.remove();
                    resolve();
                }, 1300);
            });
        }

        async checkAnswer() {
            if(this.waitingForFeedback) return;
            
            const q = this.allQuestions[this.currentIndex];
            const userAnswer = parseInt(this.currentInput, 10);
            
            if(isNaN(userAnswer)) {
                document.getElementById("statusMsg").innerHTML = "⚠️ لطفاً یک عدد وارد کن!";
                return;
            }
            
            this.waitingForFeedback = true;
            
            if(userAnswer === q.answer) {
                this.score += 10;
                playCorrect();
                await this.showMotivationMessage(true);
                await this.moveToNextQuestion();
            } else {
                this.lives -= 1;
                this.score = Math.max(0, this.score - 5);
                playWrong();
                await this.showMotivationMessage(false, q.answer);
                this.updateStats();
                
                if(this.lives <= 0) {
                    this.lives = 0;
                    this.updateStats();
                    this.waitingForFeedback = false;
                    this.endGame(true);
                    return;
                }
                // سوال مشابه دوباره
                this.waitingForFeedback = false;
                document.getElementById("statusMsg").innerHTML = "🔁 دوباره تلاش کن! جواب را وارد کن";
                this.currentInput = "";
                this.updateAnswerDisplay();
            }
            this.updateStats();
        }

        async moveToNextQuestion() {
            this.currentIndex++;
            this.waitingForFeedback = false;
            if(this.currentIndex >= this.allQuestions.length) {
                this.endGame();
            } else {
                this.renderQuestion();
            }
        }

        startTimer() {
            this.timerInterval = setInterval(() => {
                if(this.timeLeft <= 0) {
                    clearInterval(this.timerInterval);
                    this.endGame(true);
                } else {
                    this.timeLeft--;
                    let minutes = Math.floor(this.timeLeft / 60);
                    let seconds = this.timeLeft % 60;
                    document.getElementById("timerDisplay").innerText = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
                }
            }, 1000);
        }

        endGame(forced = false) {
            if(this.timerInterval) clearInterval(this.timerInterval);
            if(bgAudio && !bgAudio.paused) bgAudio.pause();
            
            let msg = "";
            if(this.score >= 150) msg = "🔥 فوق‌العاده! قهرمان ریاضی! 🔥";
            else if(this.score >= 100) msg = "🌟 عالی! می‌تونی بهتر هم بشی 🌟";
            else msg = "💪 خوب بود! تمرین کن تا عالی شی 💪";
            
            const container = document.getElementById("mainGameRoot");
            let animePanel = "";
            if(this.score >= 150) {
                animePanel = `
                    <div class="anime-btns">
                        <button id="watchCartoon1">🎬 کارتون ۱ (شگفتی‌ها)</button>
                        <button id="watchCartoon2">🎬 کارتون ۲ (ماجراجویی)</button>
                    </div>
                    <div style="font-size:14px;">کلیک کن تا در صفحه جدید باز شود</div>
                `;
            }
            
            container.innerHTML = `
                <div class="modal" style="position:relative; background:transparent; z-index:10;">
                    <div class="modal-card">
                        <h2>📊 کارنامه 📊</h2>
                        <p>نام: ${this.playerName}</p>
                        <p>امتیاز نهایی: ${this.score} از 200</p>
                        <p>❤️ جان باقی‌مانده: ${this.lives}</p>
                        <p style="font-size:22px;">${msg}</p>
                        ${animePanel}
                        <div style="display:flex; gap:15px; justify-content:center; margin-top:20px;">
                            <button id="restartGameBtn">🔄 بازی دوباره</button>
                            <button id="moreGamesBtn">🎮 بازی‌های بیشتر</button>
                        </div>
                    </div>
                </div>
                <div class="footer">طراح: الهام باقری</div>
            `;
            
            document.getElementById("restartGameBtn")?.addEventListener("click", () => location.reload());
            document.getElementById("moreGamesBtn")?.addEventListener("click", () => window.open("https://eitaa.com/Nevisha", "_blank"));
            if(this.score >= 150) {
                document.getElementById("watchCartoon1")?.addEventListener("click", () => window.open("https://www.aparat.com/v/tcfuuax", "_blank"));
                document.getElementById("watchCartoon2")?.addEventListener("click", () => window.open("https://www.aparat.com/v/iucb0tg", "_blank"));
            }
        }
    }

    function showNameModal() {
        initAudio();
        const root = document.getElementById("mainGameRoot");
        root.innerHTML = `
            <div class="modal">
                <div class="modal-card">
                    <h2>🧮 ماشین حساب ریاضی 🧮</h2>
                    <p style="font-size:16px; text-align:center; line-height:1.6;">
                        📌 <strong>قوانین بازی:</strong><br>
                        • ۱۰ سوال ضرب (یک رقمی و دو رقم با یکان صفر)<br>
                        • ۱۰ سوال تقسیم (عدد بزرگتر ÷ عدد کوچکتر)<br>
                        • ⏱️ زمان ۵ دقیقه | ❤️ ۵ جان<br>
                        • ✅ هر پاسخ درست: ۱۰ امتیاز | ❌ هر پاسخ نادرست: -۵ امتیاز و -۱ جان<br>
                        • 🎯 امتیاز بالای ۱۵۰ = تماشای انیمیشن جایزه!<br>
                        • 🔊 صدای زمینه با دکمه موسیقی فعال می‌شود
                    </p>
                    <input type="text" id="playerNameInput" placeholder="نام و نام خانوادگی" autocomplete="off">
                    <button id="startBtn">شروع بازی</button>
                    <div class="footer" style="margin-top:20px;">طراح: الهام باقری</div>
                </div>
            </div>
        `;
        document.getElementById("startBtn").addEventListener("click", () => {
            const name = document.getElementById("playerNameInput").value.trim();
            if(name === "") {
                alert("لطفاً نام خود را وارد کنید");
                return;
            }
            if(bgAudio) {
                bgAudio.play().catch(e=>console.log("برای پخش موسیقی با صفحه تعامل کنید"));
            }
            new MathGame(name);
        });
    }

    showNameModal();
</script>
</body>
</html>
